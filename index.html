<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal G&amp;A</title>
<meta name="theme-color" content="#0B3F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portal G&amp;A">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #F1F2F0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  /* Barra de avisos (aparece por cima do Portal, embaixo da tela) */
  #av { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
        max-width: 520px; margin: 0 auto; background: #0B3F5E; color: #fff; border-radius: 14px;
        box-shadow: 0 8px 28px rgba(0,0,0,.28); padding: 14px 16px; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #av[hidden] { display: none; }
  #av p { margin: 0 0 10px; }
  #av b { font-weight: 600; }
  #av .bt { display: flex; gap: 8px; flex-wrap: wrap; }
  #av button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; }
  #av .sim { background: #fff; color: #0B3F5E; }
  #av .nao { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
</style>
</head>
<body>
<!-- Endereço do portal: o link /exec da implantação do Apps Script -->
<iframe id="portal" title="Portal de Produção" allow="clipboard-write"></iframe>
<div id="av" role="dialog" aria-live="polite" hidden></div>
<script src="config.js"></script>
<script>
  var PORTAL = 'https://script.google.com/macros/s/AKfycbxivTeMXJEekFGV8yZdrGRmJzshWpv7ziDEcXuEgB275WAPF-yEpE2ngUr1cWw5hNvZ/exec';
  // Repassa ?v=saida&k=... para abrir o app de material pelo mesmo endereço
  document.getElementById('portal').src = PORTAL + location.search;

  /* ================= Avisos no celular ================= */
  (function () {
    var FB = 'https://www.gstatic.com/firebasejs/10.14.1/';
    var ORIGEM_PORTAL = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;   // de onde o Portal (Apps Script) fala
    var ADIAR_DIAS = 3;
    var configurado = !!(self.FIREBASE_CONFIG && self.VAPID_KEY && self.VAPID_KEY !== 'COLE_AQUI');
    var suporta = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /android/i.test(navigator.userAgent);
    var instalado = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    var portal = null, origem = '', usuario = null, pedidoInstalar = null, reg = null, msg = null;
    var bar = document.getElementById('av');

    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); pedidoInstalar = e; });
    window.addEventListener('appinstalled', function () { pedidoInstalar = null; });

    if (configurado && suporta) {
      reg = navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function (e) { console.warn(e); return null; });
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function guardado(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function guardar(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } }
    function adiado() { var t = Number(guardado('av_adiado') || 0); return t && Date.now() - t < ADIAR_DIAS * 864e5; }
    function aparelho() { return (ios ? 'iPhone' : android ? 'Android' : 'Computador') + (instalado ? ' (app)' : ' (navegador)'); }

    function barra(html, botoes) {
      bar.innerHTML = '<p>' + html + '</p><div class="bt">' + (botoes || []).map(function (b, i) {
        return '<button type="button" class="' + (b.sec ? 'nao' : 'sim') + '" data-i="' + i + '">' + esc(b.txt) + '</button>';
      }).join('') + '</div>';
      bar.querySelectorAll('button').forEach(function (el) {
        el.onclick = function () { var b = botoes[Number(el.dataset.i)]; if (b.fn) b.fn(); else esconder(); };
      });
      bar.hidden = false;
    }
    function esconder() { bar.hidden = true; }
    function agoraNao() { guardar('av_adiado', String(Date.now())); esconder(); }

    function carregar(src) {
      return new Promise(function (ok, erro) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = erro; document.head.appendChild(s); });
    }
    function mensageiro() {
      if (msg) return Promise.resolve(msg);
      return carregar(FB + 'firebase-app-compat.js').then(function () { return carregar(FB + 'firebase-messaging-compat.js'); }).then(function () {
        if (!firebase.apps.length) firebase.initializeApp(self.FIREBASE_CONFIG);
        msg = firebase.messaging();
        // Aviso que chega com o Portal aberto na tela: mostra igual
        msg.onMessage(function (p) {
          var n = p.notification || {}, d = p.data || {};
          Promise.resolve(reg).then(function (r) {
            if (r) r.showNotification(n.title || 'Portal G&A', { body: n.body || '', icon: 'icone-192.png', badge: 'badge-96.png', data: { link: d.link || location.href } });
          });
        });
        return msg;
      });
    }

    /* Pega o endereço deste celular e manda para o Portal guardar no nome de quem entrou. */
    function registrar() {
      return Promise.resolve(reg).then(function (r) {
        if (!r) throw new Error('sem service worker');
        return mensageiro().then(function (m) { return m.getToken({ vapidKey: self.VAPID_KEY, serviceWorkerRegistration: r }); });
      }).then(function (token) {
        if (token && portal && usuario) portal.postMessage({ ga: 1, tipo: 'token', token: token, aparelho: aparelho() }, origem);
        return token;
      });
    }

    function ativar() {
      barra('Ativando…', []);
      Notification.requestPermission().then(function (p) {
        if (p !== 'granted') {
          barra('Os avisos ficaram bloqueados. Para ligar depois, libere as notificações do Portal nas configurações do celular.', [{ txt: 'Ok' }]);
          return;
        }
        return registrar().then(function () {
          if (!instalado && pedidoInstalar) {
            barra('<b>Avisos ativados!</b> Instale o Portal para os avisos aparecerem com o nome e o ícone da Gesso & Artes.', [
              { txt: 'Instalar', fn: function () { pedidoInstalar.prompt(); pedidoInstalar = null; esconder(); } }, { txt: 'Agora não', sec: true }]);
          } else {
            barra('<b>Avisos ativados!</b> Você vai receber os avisos da Gesso & Artes neste celular.', [{ txt: 'Ok' }]);
            setTimeout(esconder, 6000);
          }
        });
      }).catch(function (e) {
        console.warn(e);
        barra('Não deu para ativar os avisos agora. Tente de novo mais tarde.', [{ txt: 'Ok' }]);
      });
    }

    function aoEntrar() {
      if (!configurado) return;
      if (!suporta) {
        // iPhone pelo Safari: só recebe aviso com o Portal na Tela de Início
        if (ios && !instalado && !adiado()) {
          barra('<b>Quer receber avisos no iPhone?</b> Toque em Compartilhar <span aria-hidden="true">⬆️</span> e depois em <b>Adicionar à Tela de Início</b>. Depois abra o Portal pelo ícone e entre de novo.', [
            { txt: 'Entendi', fn: agoraNao }]);
        }
        return;
      }
      if (Notification.permission === 'granted') { registrar().catch(function (e) { console.warn(e); }); return; }
      if (Notification.permission === 'denied' || adiado()) return;
      barra('<b>Receber avisos da Gesso & Artes neste celular?</b> Pagamento, obras e recados da gestão.', [
        { txt: 'Ativar avisos', fn: ativar }, { txt: 'Agora não', sec: true, fn: agoraNao }]);
    }

    /* Conversa com o Portal (Apps Script dentro do quadro) */
    window.addEventListener('message', function (e) {
      if (!ORIGEM_PORTAL.test(e.origin)) return;
      var d = e.data || {};
      if (!d.ga) return;
      portal = e.source; origem = e.origin;
      if (d.tipo === 'login') { usuario = d.nome || '?'; aoEntrar(); }
      else if (d.tipo === 'saiu') { usuario = null; esconder(); }
      else if (d.tipo === 'ativar') {   // botão "Ativar avisos" de dentro do Portal
        guardar('av_adiado', null);
        if (!configurado) return;
        if (suporta && Notification.permission === 'denied') barra('Os avisos estão bloqueados neste celular. Libere as notificações do Portal nas configurações do celular ou do navegador.', [{ txt: 'Ok' }]);
        else aoEntrar();
      }
      else if (d.tipo === 'estado') {
        portal.postMessage({ ga: 1, tipo: 'estado', suporta: suporta, configurado: configurado, ios: ios, instalado: instalado,
          permissao: suporta ? Notification.permission : 'indisponivel' }, origem);
      }
    });
  })();
</script>
</body>
</html>
